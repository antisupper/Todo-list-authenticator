{% extends 'base.html' %}

{% block head %}
<title>Task Smash</title>
{% endblock %}

{% block body %}
<div class = 'content'>
    <h1>Update Task here</h1>
    <p>Let's get your task up to date</p>
    <form action="/update/{{task.id}}" method="POST">
        <input type="text" name="content" id="content" />
        <input type="submit" value="Update" id="add_btn"/>
    </form>
</div>
{% endblock %}
